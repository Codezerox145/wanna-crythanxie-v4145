name: Verify WANNA-CRY THANXIEE
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install API and bot dependencies
        run: npm install
      - name: Run API integration and command tests
        run: npm test
        env:
          JWT_SECRET: ci-only-secret-value-with-at-least-32-characters
      - name: Install dashboard dependencies
        working-directory: dashboard-clean
        run: npm install
      - name: Build dashboard
        working-directory: dashboard-clean
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: https://example.invalid
          NEXT_PUBLIC_BOT_NAME: WANNA-CRY THANXIEE
